version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector_db
    environment:
      POSTGRES_DB: openclaw
      POSTGRES_USER: jhe
      POSTGRES_PASSWORD: openclaw_secure_pass_2026
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhe -d openclaw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: